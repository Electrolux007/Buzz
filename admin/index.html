<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080909">
    <title>BUZZ — Admin Dashboard</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <header class="site-header">
        <a class="brand" href="../index.html">BU<span>ZZ</span><i></i> <small style="font-size: 12px; color: var(--green); font-weight: 400;">[ADMIN]</small></a>

        <nav aria-label="Primary navigation">
            <a href="../index.html">Home</a>
            <a href="../store.html">Store</a>
            <a href="admin.html" class="active">Dashboard</a>
        </nav>

        <div class="nav-actions">
            <a class="cart-link" href="../cart.html" aria-label="Shopping cart" style="position: relative;">
                <img src="../Assets/shopping_cart_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                <span id="cart-badge" style="position: absolute; top: -6px; right: -8px; background: #38bdf8; color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; display: none;">0</span>
            </a>
        </div>
    </header>

    <main style="max-width: 1000px; margin: 0 auto; padding: 40px 20px;">
        <h1 style="font-size: 2.2rem; color: #fff; margin-bottom: 8px;">INVENTORY DASHBOARD</h1>
        <p style="color: var(--muted); margin-bottom: 40px;">Add new hardware specs to Firestore or review existing stock items.</p>

        <!-- Add Product Form Card -->
        <div style="background: var(--panel); border: 1px solid var(--line); padding: 30px; border-radius: 8px; margin-bottom: 50px;">
            <h2 style="font-size: 1.4rem; color: #fff; margin-bottom: 20px;">Add New Product</h2>
            <form id="add-product-form" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div>
                    <label style="display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; margin-bottom: 6px;">Product Name</label>
                    <input type="text" id="p-name" required placeholder="e.g. Apex Mechanical Keyboard" style="width: 100%; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); color: #fff; border-radius: 4px;">
                </div>
                <div>
                    <label style="display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; margin-bottom: 6px;">Price ($)</label>
                    <input type="number" step="0.01" id="p-price" required placeholder="149.99" style="width: 100%; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); color: #fff; border-radius: 4px;">
                </div>
                <div>
                    <label style="display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; margin-bottom: 6px;">Category</label>
                    <select id="p-category" style="width: 100%; padding: 12px; background: var(--panel); border: 1px solid var(--line); color: #fff; border-radius: 4px;">
                        <option value="Phones">Phones</option>
                        <option value="Laptops">Laptops</option>
                        <option value="Gaming">Gaming</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; margin-bottom: 6px;">Image URL</label>
                    <input type="url" id="p-image" required placeholder="https://images.unsplash.com/..." style="width: 100%; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); color: #fff; border-radius: 4px;">
                </div>
                <div style="grid-column: span 2;">
                    <label style="display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; margin-bottom: 6px;">Description</label>
                    <textarea id="p-desc" rows="3" placeholder="High-performance specs..." style="width: 100%; padding: 12px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); color: #fff; border-radius: 4px;"></textarea>
                </div>
                <div style="grid-column: span 2;">
                    <button type="submit" class="button button-primary" style="width: 100%; justify-content: center; cursor: pointer; border: none;">Publish Product to Database</button>
                </div>
            </form>
        </div>

        <!-- Live Management List -->
        <h2 style="font-size: 1.4rem; color: #fff; margin-bottom: 20px;">Existing Database Inventory</h2>
        <div id="admin-product-list" style="display: flex; flex-direction: column; gap: 12px;">
            <p style="color: var(--muted);">Loading current inventory...</p>
        </div>
    </main>

    <footer class="site-footer" style="margin-top: 80px;">
        <a class="brand" href="../index.html">BU<span>ZZ</span><i></i></a>
        <p>© ELECTROLUX DEV TEAM KAWAII</p>
    </footer>

    <!-- Admin Logic Script -->
    <script type="module">
        import { db } from "../firebase-config.js";
        import { collection, addDoc, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const productListEl = document.getElementById("admin-product-list");

        async function fetchAdminInventory() {
            try {
                const querySnapshot = await getDocs(collection(db, "Products"));
                productListEl.innerHTML = "";

                if (querySnapshot.empty) {
                    productListEl.innerHTML = `<p style="color: var(--muted);">No items found in Firestore database.</p>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const row = document.createElement("div");
                    row.style.cssText = "display: flex; align-items: center; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); padding: 16px; border-radius: 6px;";
                    
                    row.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 16px;">
                            <img src="${item.image}" alt="${item.name}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 4px;">
                            <div>
                                <h3 style="color: #fff; font-size: 1rem; margin-bottom: 2px;">${item.name}</h3>
                                <p style="color: var(--muted); font-size: 0.85rem; margin: 0;">${item.category || 'Hardware'} • $${item.price?.toFixed(2) || '0.00'}</p>
                            </div>
                        </div>
                        <button onclick="deleteProduct('${docSnap.id}')" style="background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase;">Delete</button>
                    `;
                    productListEl.appendChild(row);
                });
            } catch (err) {
                console.error("Error fetching inventory:", err);
                productListEl.innerHTML = `<p style="color: #ef4444;">Failed to load items.</p>`;
            }
        }

        // Add Product Form Submission
        document.getElementById("add-product-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const newProduct = {
                name: document.getElementById("p-name").value,
                price: parseFloat(document.getElementById("p-price").value),
                category: document.getElementById("p-category").value,
                image: document.getElementById("p-image").value,
                description: document.getElementById("p-desc").value
            };

            try {
                await addDoc(collection(db, "Products"), newProduct);
                alert("Successfully added product to Firestore!");
                document.getElementById("add-product-form").reset();
                fetchAdminInventory();
            } catch (err) {
                console.error("Error adding document: ", err);
                alert("Failed to add product. Check console for details.");
            }
        });

        // Delete Product Global Function
        window.deleteProduct = async function(id) {
            if (confirm("Are you sure you want to delete this product from the database?")) {
                try {
                    await deleteDoc(doc(db, "Products", id));
                    fetchAdminInventory();
                } catch (err) {
                    console.error("Error deleting product:", err);
                    alert("Failed to delete item.");
                }
            }
        };

        fetchAdminInventory();
    </script>
    <script src="../cart-helper.js"></script>
</body>

</html>
