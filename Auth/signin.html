<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — BUZZ</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-layout">
    <!-- Left Side: Form Card (Wider) -->
    <main class="auth-card" aria-labelledby="page-title">
      <header class="brand">
        <h1 id="page-title">Welcome back</h1>
        <p>Sign in to continue to BUZZ</p>
      </header>

      <form id="signin-form" class="auth-form">
        <div class="form-field">
          <label for="signin-email">Email address</label>
          <input id="signin-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="signin-password">Password</label>
          <input id="signin-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <div class="form-row">
          <label class="checkbox-label" for="remember-me">
            <input id="remember-me" name="remember-me" type="checkbox">
            Remember me
          </label>
          <a id="forgot-password-link" href="#">Forgot password?</a>
        </div>
        <button id="signin-submit-button" class="submit-button" type="submit">Sign in</button>
        <p class="auth-link">Need an account? <a href="./index.html">Sign up</a></p>
       <button type="button" id="google-signin-button" class="google-btn">
  <!-- Hardcoding width and height here stops it from expanding -->
  <svg width="20" height="20" viewBox="0 0 24 24" style="flex-shrink: 0;">
    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
  </svg>
  <span>Continue with Google</span>
</button>
      </form>
    </main>

    <!-- Right Side: Floating Tech Image Card -->
    <div class="auth-image-panel">
        <img src="https://plus.unsplash.com/premium_photo-1682148619041-d161e57060f7?q=80&w=688&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="High-end workstation setup">
        <div class="auth-image-overlay"></div>
        <div class="auth-image-content">
            
            <h2>POWER YOUR WORLD</h2>
            <p>Log in to manage your curated gear, track shipments, and explore elite hardware releases.</p>
        </div>
    </div>
  </div>
</body>
<script type="module" src="../firebase-config.js"></script>
<script  type="module" src="./script.js" defer></script>
</html>
