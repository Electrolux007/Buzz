<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080909">
    <title>BUZZ — Product Details</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Force image color override -->
    <style>
        #product-container img {
            filter: none !important;
            -webkit-filter: none !important;
            mix-blend-mode: normal !important;
        }
    </style>
</head>

<body>
    <!-- Top Navigation -->
    <header class="site-header">
        <a class="brand" href="index.html">BU<span>ZZ</span><i></i></a>

        <nav aria-label="Primary navigation">
            <a href="index.html">Home</a>
            <a href="store.html">Store</a>
            <a href="index.html#support">Support</a>
            <a href="index.html#games">Games</a>
        </nav>

        <div class="auth-buttons">
            <a href="./Auth/signin.html" class="btn-login">Log in</a>
            <a href="./Auth/index.html" class="btn-signup">Sign Up</a>
        </div>

        <div class="nav-actions">
    <a href="#search" aria-label="Search"><img src="./Assets/search_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt=""></a>
    <a class="cart-link" href="cart.html" aria-label="Shopping cart" style="position: relative;">
        <img src="./Assets/shopping_cart_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt="">
        <span id="cart-badge" style="position: absolute; top: -6px; right: -8px; background: #38bdf8; color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; display: none;">0</span>
    </a>
    <a href="#account" aria-label="Account"><img src="./Assets/account_box_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt=""></a>
</div>
    </header>

    <main>
        <section class="featured" id="product-detail-section" style="padding-top: 80px; min-height: 70vh;">
            <div id="product-container" style="max-width: 900px; margin: 0 auto; padding: 20px;">
                <p style="color: #9ca3af;">Loading product details...</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <a class="brand" href="index.html">BU<span>ZZ</span><i></i></a>
        <p>© ELECTROLUX DEV TEAM KAWAII</p>

        <div class="footer-links">
            <a href="./Auth/signin.html">Sign in</a>
            <a href="#cart">Cart</a>
            <a href="index.html#support">Help center</a>
        </div>
    </footer>

    <!-- Fetch Single Product Script -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        async function loadProductDetails() {
            const container = document.getElementById("product-container");
            
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get("id");

            if (!productId) {
                container.innerHTML = `<p style="color: #ef4444;">No product specified. <a href="store.html" style="color: #fff; text-decoration: underline;">Return to store</a></p>`;
                return;
            }

            try {
                const docRef = doc(db, "Products", productId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    container.innerHTML = `<p style="color: #ef4444;">Product not found in database.</p>`;
                    return;
                }

                const product = docSnap.data();

                container.innerHTML = `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start;">
                        <div class="product-image" style="border-radius: 12px; overflow: hidden; background: #121315;">
                            <img src="${product.image || 'https://images.unsplash.com/photo-1587302912306-cf1ed9c33146?auto=format&fit=crop&w=900&q=85'}" 
                                 alt="${product.name}" style="width: 100%; height: auto; display: block;">
                        </div>
                        <div>
                            <span class="product-badge" style="display: inline-block; margin-bottom: 12px;">${product.category || 'HARDWARE'}</span>
                            <h1 style="font-size: 2rem; color: #fff; margin-bottom: 12px; font-weight: 700;">${product.name}</h1>
                            <p style="font-size: 1.5rem; color: #38bdf8; font-weight: 600; margin-bottom: 24px;">$${product.price ? product.price.toFixed(2) : '0.00'}</p>
                            <p style="color: #9ca3af; line-height: 1.6; margin-bottom: 32px;">${product.description || 'High-performance gear built for peak execution under pressure. Fully verified components matching your tech spec requirements.'}</p>
                            
                            <button id="add-to-cart-btn" class="btn-signup" style="width: 100%; padding: 14px; text-align: center; cursor: pointer; border: none; font-size: 1rem;">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                `;

                // Hook up the Add to Cart button interaction with localStorage persistence
document.getElementById("add-to-cart-btn").addEventListener("click", () => {
    let cart = JSON.parse(localStorage.getItem("buzz_cart")) || [];

    const existingItem = cart.find(item => item.id === productId);
    if (existingItem) {
        existingItem.quantity = (existingItem.quantity || 1) + 1;
    } else {
        cart.push({
            id: productId,
            name: product.name,
            price: product.price || 0,
            image: product.image || '',
            quantity: 1
        });
    }

    localStorage.setItem("buzz_cart", JSON.stringify(cart));
    
    // Update the badge globally across the page
    if (typeof updateCartBadge === "function") {
        updateCartBadge();
    }
    
    alert(`Successfully added "${product.name}" to your cart! Total items: ${cart.reduce((sum, item) => sum + item.quantity, 0)}`);
});
            } catch (error) {
                console.error("Error fetching product:", error);
                container.innerHTML = `<p style="color: #ef4444;">Failed to load product information.</p>`;
            }
        }

        loadProductDetails();
    </script>
    <script src="cart-helper.js"></script>
</body>

</html>
