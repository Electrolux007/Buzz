<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080909">
    <title>BUZZ — Store Inventory</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Force full color on product images for store.html -->
    <style>
        .product-card img, 
        .product-image img {
            filter: none !important;
            -webkit-filter: none !important;
        }
    </style>
</head>

<body>
    <!-- Top Navigation bar mirroring index.html -->
    <header class="site-header">
        <a class="brand" href="index.html">BU<span>ZZ</span><i></i></a>

        <nav aria-label="Primary navigation">
            <a href="index.html">Home</a>
            <a class="active" href="store.html">Store</a>
            <a href="index.html#support">Support</a>
            <a href="index.html#games">Games</a>
        </nav>

        <div class="auth-buttons">
            <a href="./Auth/signin.html" class="btn-login">Log in</a>
            <a href="./Auth/index.html" class="btn-signup">Sign Up</a>
        </div>

        <div class="nav-actions">
            <a href="#search" aria-label="Search"><img src="./Assets/search_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt=""></a>
            <a class="cart-link" href="cart.html" aria-label="Shopping cart" style="position: relative;">
                <img src="./Assets/shopping_cart_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                <span id="cart-badge" style="position: absolute; top: -6px; right: -8px; background: #38bdf8; color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px; display: none;">0</span>
            </a>
            <a href="#account" aria-label="Account"><img src="./Assets/account_box_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt=""></a>
        </div>
    </header>

    <main>
        <section class="featured" id="shop" style="padding-top: 60px; min-height: 70vh;">
            <div class="section-heading" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px;">
                <div>
                    <h2>CHECK OUT OUR<br><em>INVENTORY</em></h2>
                </div>
                <!-- Filter Buttons Bar -->
                <div id="filter-container" style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="filter-btn active" data-filter="all" style="background: var(--green); color: var(--bg); border: none; padding: 8px 16px; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.3s ease;">All</button>
                    <button class="filter-btn" data-filter="Phones" style="background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.3s ease;">Phones</button>
                    <button class="filter-btn" data-filter="Laptops" style="background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.3s ease;">Laptops</button>
                    <button class="filter-btn" data-filter="Gaming" style="background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.3s ease;">Gaming</button>
                    <button class="filter-btn" data-filter="Accessories" style="background: rgba(255,255,255,0.05); color: var(--muted); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: all 0.3s ease;">Accessories</button>
                </div>
            </div>

            <!-- Firestore products will dynamically inject using your existing product-card classes -->
            <div class="product-grid" id="firestore-product-grid" style="margin-top: 40px;">
                <p style="color: #9ca3af; font-size: 14px; padding: 20px;">Fetching inventory from Firestore...</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <a class="brand" href="index.html">BU<span>ZZ</span><i></i></a>
        <p>© ELECTROLUX DEV TEAM KAWAII</p>

        <div class="footer-links">
            <a href="./Auth/signin.html">Sign in</a>
            <a href="cart.html">Cart</a>
            <a href="index.html#support">Help center</a>
        </div>
    </footer>

    <!-- Firestore Integration & Filter Script -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        let allProducts = [];

        async function loadStoreInventory() {
            const grid = document.getElementById("firestore-product-grid");

            try {
                const querySnapshot = await getDocs(collection(db, "Products"));
                allProducts = [];

                if (querySnapshot.empty) {
                    grid.innerHTML = `<p style="color: #9ca3af;">No products found in the database.</p>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    allProducts.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderProducts(allProducts);
            } catch (error) {
                console.error("Error loading products:", error);
                grid.innerHTML = `<p style="color: #ef4444;">Failed to load store data from database.</p>`;
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById("firestore-product-grid");
            grid.innerHTML = "";

            if (products.length === 0) {
                grid.innerHTML = `<p style="color: #9ca3af; grid-column: span 3; text-align: center; padding: 40px;">No items match this category filter.</p>`;
                return;
            }

            products.forEach((product) => {
                const article = document.createElement("article");
                article.className = "product-card";
                
                article.innerHTML = `
                    <div class="product-image">
                        <span class="product-badge">${product.category || 'New'}</span>
                        <img src="${product.image || 'https://images.unsplash.com/photo-1587302912306-cf1ed9c33146?auto=format&fit=crop&w=900&q=85'}" 
                             alt="${product.name}">
                    </div>
                    <div class="product-meta">
                        <div>
                            <p>${product.category ? product.category.toUpperCase() : 'HARDWARE'}</p>
                            <h3>${product.name}</h3>
                        </div>
                        <strong>$${product.price ? product.price.toFixed(2) : '0.00'}</strong>
                    </div>
                    <a class="card-link" href="product.html?id=${product.id}">
                        View details <span>↗</span>
                    </a>
                `;

                grid.appendChild(article);
            });
        }

        // Setup filter button interactions
        const filterButtons = document.querySelectorAll(".filter-btn");
        filterButtons.forEach(btn => {
            btn.addEventListener("click", (e) => {
                filterButtons.forEach(b => {
                    b.style.background = "rgba(255,255,255,0.05)";
                    b.style.color = "var(--muted)";
                    b.style.borderColor = "rgba(255,255,255,0.1)";
                });
                e.target.style.background = "var(--green)";
                e.target.style.color = "var(--bg)";
                e.target.style.borderColor = "var(--green)";

                const category = e.target.getAttribute("data-filter");
                if (category === "all") {
                    renderProducts(allProducts);
                } else {
                    const filtered = allProducts.filter(p => 
                        p.category && p.category.toLowerCase() === category.toLowerCase()
                    );
                    renderProducts(filtered);
                }
            });
        });

        loadStoreInventory();
    </script>
    <script src="cart-helper.js"></script>
</body>

</html>
